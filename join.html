<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب الانضمام</title>
</head>

<body>
    <h1>Joining</h1>

    <form>
        <label>Name:</label><br>
        <input type="text" placeholder="Enter name"><br><br>

        <label>Email:</label><br>
        <input type="email" placeholder="Enter email"><br><br>

        <label>Phone number:</label><br>
        <input type="text" placeholder="Enter phone"><br><br>

        <label>Enter Age:</label><br>
        <input type="number" placeholder="Enter age"><br><br>

        <p><strong>Subscription type:</strong></p>
        <input type="radio" name="sub"><label>Annual</label><br>
        <input type="radio" name="sub"><label>Monthly</label><br>

        <p><strong>Desired service:</strong></p>
        <input type="checkbox"><label>Bodybuilding</label><br>
        <input type="checkbox"><label>Physical Fitness</label><br>
        <input type="checkbox"><label>Cardio</label><br><br>

        <label>Place of residence:</label>
        <select>
            <option>select City</option>
            <option>Gaza</option>
            <option>Khan Yunis</option>
            <option>Rafah</option>
        </select><br><br>

        <label>Add a picture</label>
        <input type="file"><br><br>

        <label>Notes:</label><br>
        <textarea placeholder="notes" rows="5" cols="25"></textarea><br><br>

        <input type="submit" value="Submit">
    </form>

    <br>
    <a href="index.html">الرجوع للرئيسية</a>

</body>

</html>
